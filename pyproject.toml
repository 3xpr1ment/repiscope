[project]
name = "repiscope"
version = "0.2.0"
description = "A periscope for your repos - read-only MCP server for sibling repository context"
requires-python = ">=3.11"
dependencies = [
    "mcp",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
repiscope = "repiscope.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
