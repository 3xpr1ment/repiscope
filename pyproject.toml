[project]
name = "repiscope"
version = "0.2.2"
description = "A periscope for your repos - read-only MCP server for sibling repository context"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "3xpr1ment" }]
keywords = ["mcp", "mcp-server", "llm", "agent", "read-only", "repositories"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
    "mcp",
]

[project.urls]
Homepage = "https://github.com/3xpr1ment/repiscope"
Repository = "https://github.com/3xpr1ment/repiscope"
Issues = "https://github.com/3xpr1ment/repiscope/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
repiscope = "repiscope.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
